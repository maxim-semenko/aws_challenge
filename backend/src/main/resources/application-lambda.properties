# Activated by the Lambda handlers (ApiLambdaHandler / PostConfirmationHandler)

# Structured JSON logs to stdout -> CloudWatch Logs (MDC: awsRequestId, apiRequestId, userSub)
logging.structured.format.console=ecs
logging.structured.ecs.service.name=aws_challenge

# Don't run migrations on every cold start; enable on one function (FLYWAY_ENABLED=true) or migrate separately
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# Fail fast instead of eating the Lambda timeout when the DB/RDS Proxy is unreachable
spring.datasource.hikari.connection-timeout=3000

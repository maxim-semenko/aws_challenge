spring.application.name=aws_challenge
spring.main.banner-mode=off

# --- Database: PostgreSQL + pgvector (in AWS: the RDS Proxy endpoint) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aws_challenge}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app}
# RDS Proxy does the real connection pooling; a Lambda instance serves one request at a time
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000

spring.jpa.open-in-view=false
# Schema is owned by Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=${FLYWAY_ENABLED:true}

# --- AWS ---
# In Lambda AWS_REGION is set by the runtime
app.aws.region=${AWS_REGION:us-east-1}
app.bedrock.embedding-model-id=${BEDROCK_EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
app.bedrock.embedding-dimensions=1024

# true only for local runs without API Gateway (see application-local.properties)
app.auth.dev-user-enabled=false

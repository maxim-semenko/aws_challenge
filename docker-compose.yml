# Local PostgreSQL with pgvector (same major version family as RDS)
#   docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: aws_challenge
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d aws_challenge"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
